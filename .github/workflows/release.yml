name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      release_id:
        description: Unused immutable discovery tag; the image digest remains authoritative
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_id || github.ref_name }}
  PYTHON_VERSION: "3.12"
  COSIGN_VERSION: "v3.1.3"

concurrency:
  group: custos-release-${{ github.event_name == 'workflow_dispatch' && inputs.release_id || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-docker:
    name: Build, gate, sign and receipt exact runtime image
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate source and immutable discovery tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" != refs/heads/main ]]; then
            echo "manual production publication must use main" >&2
            exit 2
          fi
          if [[ ! "$IMAGE_TAG" =~ ^[a-z0-9][a-z0-9._-]{0,127}$ ]]; then
            echo "release tag is not canonical" >&2
            exit 2
          fi

      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pinned uv action
        uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3

      - name: Set up Python
        run: uv python install "${PYTHON_VERSION}" 3.11

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(awk -F ' *= *' '/^version = / {gsub(/"/, "", $2); print $2; exit}' pyproject.toml)"
          fi
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify the complete production runtime contract
        run: |
          uv sync --python "${PYTHON_VERSION}" \
            --package custos-runner --extra dev --extra nautilus
          make check-runtime-lock
          uv run --package custos-runner ruff format --check \
            src/custos/cli/subcommands/enroll.py \
            src/custos/cli/subcommands/start.py \
            tests/test_cli_enroll.py \
            tests/test_cli_start.py \
            tests/test_release_workflow_shape.py
          uv run --package custos-runner ruff check src/ tests/ scripts/ packages/
          uv run --extra nautilus python -c \
            "import nautilus_trader; assert nautilus_trader.__version__"
          uv run --extra nautilus pytest tests/ -m "not ci_only"
          uv run python scripts/generate_strategy_contract_assets.py --check
          uv run python scripts/check-toolkit-extraction.py
          uv run --package custos-runner --extra dev --extra nautilus \
            python scripts/check-toolkit-typing-closure.py
          uv run python scripts/generate_runner_machine_request_consumer_assets.py --check
          /usr/bin/python3 scripts/check-authority-docs.py
          uv run --package custos-runner --extra dev mypy \
            --config-file packages/custos-strategy-toolkit/pyproject.toml \
            packages/custos-strategy-toolkit/src/custos_toolkit
          uv run --package custos-runner --extra dev --extra nautilus mypy \
            --config-file packages/custos-strategy-toolkit-nautilus/pyproject.toml \
            packages/custos-strategy-toolkit-nautilus/src/custos_toolkit_nautilus
          uv run mypy \
            src/custos/cli/subcommands/enroll.py \
            src/custos/cli/subcommands/start.py

      - name: Build reproducible wheel inputs
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          make dist
          for file in dist/*.whl dist/*.tar.gz; do
            sha256sum "$file"
          done | tee dist/SHA256SUMS

      - name: Sign every wheel with Sigstore keyless
        run: |
          uv sync --extra dev --extra lts --extra nautilus
          uv run bash .github/workflows/scripts/sign-wheel.sh
          uv run pytest tests/test_wheel_signature.py -v -m ci_only

      - name: Upload exact signed Python artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: dist-signed-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reject an existing discovery tag
        shell: bash
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "${IMAGE_NAME}:${IMAGE_TAG}" >/dev/null 2>&1; then
            echo "release tag already exists and cannot be repointed" >&2
            exit 1
          fi

      - name: Build and push exact linux amd64 image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.IMAGE_TAG }}

      - name: Gate the exact candidate digest
        env:
          CUSTOS_TEST_IMAGE: ${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
        run: |
          docker pull "${CUSTOS_TEST_IMAGE}"
          make install
          make verify-runtime-existing

      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Sign exact image digest with Sigstore keyless
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0700 image-evidence-custos
          cosign sign --yes \
            --bundle image-evidence-custos/sigstore-bundle.json \
            "${IMAGE_NAME}@${{ steps.push.outputs.digest }}"

      - name: Read back exact evidence and write owner receipt
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
          RELEASE_ID: ${{ env.IMAGE_TAG }}
          SOURCE_REF: ${{ github.ref }}
          WORKFLOW_FILE: .github/workflows/release.yml
          WORKFLOW_IDENTITY: https://github.com/${{ github.workflow_ref }}
          WORKFLOW_NAME: ${{ github.workflow }}
          WORKFLOW_TRIGGER: ${{ github.event_name }}
          OIDC_ISSUER: https://token.actions.githubusercontent.com
        shell: bash
        run: |
          set -euo pipefail
          evidence=image-evidence-custos
          ref="${IMAGE_NAME}@${IMAGE_DIGEST}"
          docker buildx imagetools inspect "$ref" \
            --format '{{json .Provenance}}' > "$evidence/provenance.json"
          docker buildx imagetools inspect "$ref" \
            --format '{{json .SBOM}}' > "$evidence/sbom.json"
          cosign verify \
            --certificate-identity "$WORKFLOW_IDENTITY" \
            --certificate-oidc-issuer "$OIDC_ISSUER" \
            --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
            --certificate-github-workflow-ref "$SOURCE_REF" \
            --certificate-github-workflow-sha "$GITHUB_SHA" \
            --certificate-github-workflow-name "$WORKFLOW_NAME" \
            --certificate-github-workflow-trigger "$WORKFLOW_TRIGGER" \
            --output json \
            "$ref" > "$evidence/sigstore-signature-verification.json"
          /usr/bin/python3 - "$evidence" <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          assets = {}
          for name in (
              "provenance",
              "sbom",
              "sigstore-bundle",
              "sigstore-signature-verification",
          ):
              path = root / f"{name}.json"
              value = json.loads(path.read_text())
              if not value:
                  raise SystemExit(f"{name} readback is empty")
              if name == "sigstore-signature-verification":
                  if not isinstance(value, list):
                      raise SystemExit("Sigstore verification must be a JSON array")
                  value = sorted(
                      value,
                      key=lambda item: json.dumps(
                          item, sort_keys=True, separators=(",", ":")
                      ),
                  )
              payload = json.dumps(value, sort_keys=True, separators=(",", ":")) + "\n"
              path.write_text(payload)
              data = payload.encode()
              assets[name.replace("-", "_")] = {
                  "path": path.name,
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "size_bytes": len(data),
              }
          receipt = {
              "schema_version": 1,
              "receipt_id": "CUSTOS-V1-TEAM-IMAGE-PUBLICATION-V1",
              "status": "IMAGE_PUBLISHED_ATTESTED",
              "image_key": "custos",
              "image": {
                  "repository": os.environ["IMAGE_NAME"],
                  "digest": os.environ["IMAGE_DIGEST"],
                  "platform": "linux/amd64",
              },
              "source": {
                  "repository": os.environ["GITHUB_REPOSITORY"],
                  "revision": os.environ["GITHUB_SHA"],
              },
              "workflow": {
                  "repository": os.environ["GITHUB_REPOSITORY"],
                  "run_id": int(os.environ["GITHUB_RUN_ID"]),
                  "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
                  "release_id": os.environ["RELEASE_ID"],
                  "source_ref": os.environ["SOURCE_REF"],
                  "workflow_file": os.environ["WORKFLOW_FILE"],
                  "workflow_identity": os.environ["WORKFLOW_IDENTITY"],
                  "workflow_name": os.environ["WORKFLOW_NAME"],
                  "trigger": os.environ["WORKFLOW_TRIGGER"],
                  "oidc_issuer": os.environ["OIDC_ISSUER"],
                  "cosign_version": os.environ["COSIGN_VERSION"],
              },
              "evidence": assets,
              "production_ready": False,
              "remaining_gate": "complete v1.team production bundle and deployed acceptance",
          }
          (root / "receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
          PY

      - name: Upload immutable image publication receipt
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: v1-team-custos-${{ env.IMAGE_TAG }}-${{ github.sha }}
          path: image-evidence-custos/
          if-no-files-found: error
          retention-days: 90

  verify-release:
    name: Verify exact signature and runtime contract
    runs-on: ubuntu-24.04
    needs: build-docker
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Verify exact image identity and runtime surface
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ needs.build-docker.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity "https://github.com/${GITHUB_WORKFLOW_REF}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
            --certificate-github-workflow-ref "$GITHUB_REF" \
            --certificate-github-workflow-sha "$GITHUB_SHA" \
            --certificate-github-workflow-name "$GITHUB_WORKFLOW" \
            --certificate-github-workflow-trigger "$GITHUB_EVENT_NAME" \
            "$IMAGE_REF"
          docker pull "$IMAGE_REF"
          test "$(docker run --rm --entrypoint /usr/bin/id "$IMAGE_REF" -u)" = 1000
          test "$(docker image inspect "$IMAGE_REF" --format '{{json .Config.Cmd}}')" = \
            '["start","--production-state-root","/home/custos/.arx"]'
          docker run --rm "$IMAGE_REF" --help
          for command in credential deployment enroll health identity nats nats-transport publish-capability start vault; do
            docker run --rm "$IMAGE_REF" "$command" --help
          done

  publish-pypi:
    name: Publish public runner package
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    needs: [build-docker, verify-release]
    environment:
      name: pypi
      url: https://pypi.org/p/custos-runner
    steps:
      - name: Download exact signed Python artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-signed-${{ github.sha }}
          path: dist/

      - name: Keep only public package files
        run: |
          rm -f \
            dist/*.sigstore \
            dist/SHA256SUMS \
            dist/custos_strategy_toolkit-*.whl \
            dist/custos_strategy_toolkit_nautilus-*.whl

      - name: Publish with OIDC trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  release-notes:
    name: Publish GitHub release notes
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    needs: [publish-pypi, verify-release]
    permissions:
      contents: write
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Extract exact CHANGELOG section
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v v="[${version}]" '
            $0 ~ "^## " v { flag=1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          draft: false
          prerelease: false
