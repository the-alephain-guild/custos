# =============================================================================
# Indicator warmup
# =============================================================================
# Warmup accumulates enough history before trading starts to compute the indicators.
# Three modes are supported:
#   - none: no warmup; indicators start from live data
#   - warmup: request historical data to compute the indicators (recommended)
#   - snapshot: load indicator state from a snapshot for a fast restart
# =============================================================================
warmup:
  _section:
    title: "Indicator warmup"
    description: "How the strategy indicators are warmed up so that signals are valid"

  mode:
    value: "none"
    type: string
    title: "Warmup mode"
    enum: ["none", "snapshot", "warmup"]
    description: |
      none: no warmup; indicators start from zero (suits a first run)
      warmup: request historical bars to compute the indicators (recommended for most cases)
      snapshot: restore indicator state from a snapshot (suits a fast restart)

  # Historical data (used when mode="warmup")
  history:
    _section:
      title: "Historical data"
      description: "Historical data request parameters in warmup mode"
    min_bars:
      value: 500
      type: integer
      title: "Minimum bars"
      minimum: 50
      maximum: 5000
      description: "Minimum number of historical bars the indicators need"
    preferred_bars:
      value: 2000
      type: integer
      title: "Preferred bars"
      minimum: 100
      maximum: 10000
      description: "Number of historical bars requested ideally, so the indicators are stable"
    timeout_secs:
      value: 30
      type: integer
      title: "Data request timeout"
      minimum: 5
      maximum: 300
      description: "Seconds; timeout for the historical data request"

  # Snapshot (used when mode="snapshot")
  snapshot:
    _section:
      title: "Indicator snapshot"
      description: "Initial indicator state in snapshot mode; can be aligned with an external source such as TradingView"

    timestamp:
      value: null
      type: string
      title: "Snapshot timestamp"
      description: "ISO 8601, for example 2024-01-01T00:00:00Z"

    # Indicator snapshot values (overridden by each strategy)
    # Each strategy defines the snapshot format of the indicators it uses
    # Example: SuperTrend indicator snapshot
    indicators:
      _section:
        title: "Indicator snapshot values"
        description: "State snapshot of each indicator; strategies override this section in config.yaml"

      # Example: trend indicator (SuperTrend)
      # supertrend:
      #   value: 45000.0       # SuperTrend line price
      #   trend: 1             # Trend direction: 1 = bullish, -1 = bearish, 0 = uninitialized
      #   upper_band: 45500.0  # Upper band (resistance in a downtrend)
      #   lower_band: 44500.0  # Lower band (support in an uptrend)

      # Example: momentum indicator (RSI)
      # rsi:
      #   value: 55.0          # RSI value (0-100)
      #   avg_gain: 0.5        # Average gain
      #   avg_loss: 0.4        # Average loss

      # Example: moving average (EMA)
      # ema_20:
      #   value: 44800.0       # EMA value

    # Checkpoint validation
    checkpoints:
      _section:
        title: "Checkpoint validation"
        description: "Validation points after a snapshot restore, to confirm the indicators compute correctly"

      tolerance_pct:
        value: 0.1
        type: number
        title: "Tolerance percentage"
        minimum: 0.01
        maximum: 1.0
        description: "Allowed deviation of indicator values, as a percentage (0.1 = 0.1%)"

      trend_strict:
        value: true
        type: boolean
        title: "Strict trend match"
        description: "Whether the trend direction must match exactly"

      # Validation points
      points:
        value: []
        type: array
        title: "Validation points"
        description: |
          Format example:
          - offset_bars: 5
            bar_close_time: "2024-01-01T05:00:00Z"
            supertrend:
              value: 45100.0
              trend: 1

