# =============================================================================
# The Alephain Guild - base strategy configuration
# =============================================================================
# General settings shared by every strategy
# A strategy may override these defaults in its own config.yaml
# =============================================================================

# =============================================================================
# Trading
# =============================================================================
trading:
  _section:
    title: "Trading"
  connector:
    value: "binance_perpetual"
    type: string
    title: "Exchange connector"
    enum: ["binance", "binance_perpetual", "okx_perpetual", "kucoin"]
    description: "Exchange connector name"
  leverage:
    value: 1
    type: integer
    title: "Leverage"
    minimum: 1
    maximum: 125
    description: "Contract leverage (perpetual contracts only)"
  pairs:
    value: ["BTC-USDT"]
    type: array
    title: "Trading pairs"
    description: "Trading pairs (multi-pair supported)"
  direction:
    value: "both"
    type: string
    title: "Trade direction"
    enum: ["long", "short", "both"]
    description: "Allowed trade directions"
  order_type:
    value: "limit"
    type: string
    title: "Order type"
    enum: ["market", "limit"]
    description: "Order type used to open positions"
  position_mode:
    value: "ONEWAY"
    type: string
    title: "Position mode"
    enum: ["ONEWAY", "HEDGE"]
    description: "One-way or hedge position mode"
  fees:
    _section:
      title: "Fees"
    maker:
      value: 0.0002
      type: number
      title: "Maker fee"
      description: "Fee on limit order fills (0.0002 = 0.02%)"
      minimum: 0
      maximum: 0.01
    taker:
      value: 0.0004
      type: number
      title: "Taker fee"
      description: "Fee on market order fills (0.0004 = 0.04%)"
      minimum: 0
      maximum: 0.01
    funding_rate:
      value: 0.0
      type: number
      title: "Funding rate"
      description: "Perpetual funding rate (cost estimates only; the exchange computes the real one)"
      minimum: -0.01
      maximum: 0.01

  # Nested section: execution
  execution:
    _section:
      title: "Order execution"
    price_type:
      value: "mid"
      type: string
      title: "Order price type"
      enum: ["mid", "bid", "ask"]
      description: "Mid price / best bid / best ask"
    limit_order_timeout:
      value: 60
      type: integer
      title: "Limit order timeout"
      minimum: 0
      maximum: 300
      description: "Limit order timeout (seconds)"
    slippage_tolerance:
      value: 0.001
      type: number
      title: "Slippage tolerance"
      minimum: 0.0001
      maximum: 0.01
      description: "Maximum slippage tolerance (0.001 = 0.1%)"
    retry_on_failure:
      value: true
      type: boolean
      title: "Retry on failure"
      description: "Whether a failed order is retried"
    max_retries:
      value: 3
      type: integer
      title: "Maximum retries"
      minimum: 1
      maximum: 10
    split_orders:
      _section:
        title: "Order splitting"
      enabled:
        value: false
        type: boolean
        title: "Enable order splitting"
        description: "Split large orders to reduce market impact"
      max_single_order_pct:
        value: 0.1
        type: number
        title: "Maximum slice ratio"
        minimum: 0.05
        maximum: 0.5
        description: "Largest share of the total position in a single child order"
      interval_ms:
        value: 1000
        type: integer
        title: "Slice interval"
        minimum: 100
        maximum: 10000
        description: "Milliseconds between child orders"
    price_improvement:
      _section:
        title: "Price optimization"
      enabled:
        value: false
        type: boolean
        title: "Enable price optimization"
      wait_for_pullback:
        value: false
        type: boolean
        title: "Wait for pullback entry"
        description: "After a trend signal, wait for a small pullback before entering"
      pullback_pct:
        value: 0.002
        type: number
        title: "Pullback size"
        minimum: 0.001
        maximum: 0.01
        description: "Pullback percentage to wait for"
      pullback_timeout:
        value: 300
        type: integer
        title: "Pullback wait timeout"
        minimum: 60
        maximum: 3600
        description: "Seconds; enter at market once it expires"

# =============================================================================
# Position management
# =============================================================================
position:
  _section:
    title: "Position management"
  size_type:
    value: "percentage"
    type: string
    title: "Sizing method"
    enum: ["percentage", "fixed", "kelly", "fixed_risk"]
    description: "Position sizing method (fixed_risk: sized from the stop distance using fixed_risk.risk_pct; requires a stop loss)"
  size_value:
    value: 0.1
    type: number
    title: "Position size"
    minimum: 0.01
    maximum: 1.0
    description: "Position fraction (percentage mode) or fixed amount (fixed mode)"
    optimization:
      enabled: true
      range: [0.05, 0.3]
      step: 0.05
  capital_mode:
    value: "compound"
    type: string
    title: "Capital mode"
    enum: ["compound", "fixed_capital"]
    description: "Compounding or fixed capital"
  initial_capital:
    value: 10000
    type: number
    title: "Initial capital"
    minimum: 100
    description: "Initial capital used in fixed_capital mode"
  base_size_factor:
    value: 1.0
    type: number
    title: "Base position multiplier"
    minimum: 0.1
    maximum: 1.0
    description: "Global multiplier that scales every position down together (1.0 = unchanged)"

  # Nested section: kelly
  kelly:
    _section:
      title: "Kelly parameters"
      description: "Used when size_type is kelly"
    fraction:
      value: 0.25
      type: number
      title: "Kelly fraction"
      minimum: 0.1
      maximum: 1.0
      description: "0.25-0.5 recommended (quarter to half Kelly)"
    win_rate:
      value: 0.55
      type: number
      title: "Historical win rate"
      minimum: 0.1
      maximum: 0.9
    payoff_ratio:
      value: 2.0
      type: number
      title: "Win/loss ratio"
      minimum: 0.5
      maximum: 10.0
      description: "Average win / average loss"

  # Nested section: fixed_risk (used when size_type is fixed_risk)
  fixed_risk:
    _section:
      title: "Fixed-risk parameters"
      description: "Used when size_type is fixed_risk; the native FixedRiskSizer sizes the position from the stop distance"
    risk_pct:
      value: 0.01
      type: number
      title: "Risk per trade"
      minimum: 0.001
      maximum: 0.1
      description: "Share of equity risked per trade (decimal, 0.01 = 1%); hitting the stop loses exactly this share"

  # Nested section: scaling
  scaling:
    _section:
      title: "Scaling in"
    enabled:
      value: false
      type: boolean
      title: "Enable scaling in"
      description: "Whether positions are built in several entries"
    method:
      value: "pyramid"
      type: string
      title: "Scaling method"
      enum: ["pyramid", "fixed", "martingale"]
      description: "Pyramid / fixed / martingale"
    max_entries:
      value: 3
      type: integer
      title: "Maximum entries"
      minimum: 1
      maximum: 10
      description: "Maximum number of entries, including the initial position"
      optimization:
        enabled: true
        range: [1, 5]
        step: 1
    entry_interval_pct:
      value: 0.02
      type: number
      title: "Scaling interval"
      minimum: 0.005
      maximum: 0.1
      description: "Price move percentage that triggers the next entry"
      optimization:
        enabled: true
        range: [0.01, 0.05]
        step: 0.005
    pyramid:
      scale_factor:
        value: 0.5
        type: number
        title: "Pyramid decay ratio"
        minimum: 0.1
        maximum: 1.0
        description: "2nd entry = initial x 0.5, 3rd = initial x 0.25"
    fixed:
      size_per_entry:
        value: 0.1
        type: number
        title: "Fixed scaling ratio"
        minimum: 0.01
        maximum: 0.5
        description: "Position fraction added on each entry"
    martingale:
      multiplier:
        value: 2.0
        type: number
        title: "Martingale multiplier"
        minimum: 1.5
        maximum: 3.0
        description: "Doubling factor (high risk)"

  # Nested section: limits
  limits:
    _section:
      title: "Position limits"
    max_positions_per_pair:
      value: 1
      type: integer
      title: "Maximum positions per pair"
      minimum: 1
      maximum: 10
    min_order_size:
      value: 10
      type: number
      title: "Minimum order value"
      minimum: 1
      description: "In quote currency"
    max_position_pct:
      value: 0.5
      type: number
      title: "Maximum position ratio"
      minimum: 0.1
      maximum: 1.0
      description: "Largest single-instrument position as a share of total capital"
    max_total_positions:
      value: 5
      type: integer
      title: "Maximum total positions"
      minimum: 1
      maximum: 20
      description: "Cap on the number of open positions across all pairs"
    max_total_exposure:
      value: 0.8
      type: number
      title: "Maximum total exposure"
      minimum: 0.1
      maximum: 1.0
      description: "Cap on all open positions as a share of total capital"
    max_correlated_exposure:
      value: 0.5
      type: number
      title: "Maximum correlated exposure"
      minimum: 0.1
      maximum: 1.0
      description: "Maximum combined exposure to correlated assets (such as BTC + ETH)"
    correlation_groups:
      value: []
      type: array
      title: "Correlation groups"
      description: "For example [['BTC-USDT', 'ETH-USDT'], ['SOL-USDT', 'AVAX-USDT']]"
    max_trade_size:
      value: null
      type: number
      title: "Maximum order value"
      description: "Largest order value the exchange allows (null = no limit)"

  # Nested section: dynamic_sizing
  dynamic_sizing:
    _section:
      title: "Dynamic sizing"
    enabled:
      value: false
      type: boolean
      title: "Enable dynamic sizing"
      description: "Adjust position size to market conditions and signal strength"
    volatility_adjustment:
      _section:
        title: "Volatility adjustment"
      enabled:
        value: false
        type: boolean
        title: "Volatility adjustment"
        description: "Smaller positions when volatility is high, larger when it is low"
      target_volatility:
        value: 0.02
        type: number
        title: "Target volatility"
        minimum: 0.005
        maximum: 0.1
        description: "Daily volatility target (2%)"
      lookback:
        value: 20
        type: integer
        title: "Volatility lookback"
        minimum: 5
        maximum: 60
      min_multiplier:
        value: 0.5
        type: number
        title: "Minimum adjustment factor"
        minimum: 0.1
        maximum: 1.0
      max_multiplier:
        value: 1.5
        type: number
        title: "Maximum adjustment factor"
        minimum: 1.0
        maximum: 3.0
    streak_adjustment:
      _section:
        title: "Streak adjustment"
      enabled:
        value: false
        type: boolean
        title: "Win/loss streak adjustment"
        description: "Reduce size after consecutive losses, increase modestly after consecutive wins"
      loss_reduction:
        value: 0.2
        type: number
        title: "Reduction per loss"
        minimum: 0.05
        maximum: 0.5
        description: "Reduce 20% for each consecutive loss"
      win_increase:
        value: 0.1
        type: number
        title: "Increase per win"
        minimum: 0.05
        maximum: 0.3
        description: "Increase 10% for each consecutive win"
      max_streak_adjustment:
        value: 3
        type: integer
        title: "Maximum streak counted"
        minimum: 1
        maximum: 5
        description: "Counts at most 3 consecutive results"

# =============================================================================
# Risk management
# =============================================================================
risk:
  _section:
    title: "Risk management"

  # Global risk
  global:
    _section:
      title: "Global risk"
      description: "Account- and portfolio-level risk controls"
    max_daily_loss:
      value: 0.05
      type: number
      title: "Maximum daily loss"
      minimum: 0.01
      maximum: 0.2
      description: "Daily loss ratio that pauses trading"
    max_drawdown:
      value: 0.10
      type: number
      title: "Maximum drawdown"
      minimum: 0.05
      maximum: 0.5
      description: "Drawdown ratio that pauses trading"
    consecutive_loss_pause:
      value: 3
      type: integer
      title: "Pause after consecutive losses"
      minimum: 1
      maximum: 10
      description: "Pause trading after N consecutive losses"
    max_daily_trades:
      value: 0
      type: integer
      title: "Maximum trades per day"
      minimum: 0
      description: "0 = no limit"
    max_daily_profit:
      value: 0
      type: number
      title: "Maximum daily profit"
      minimum: 0
      maximum: 1.0
      description: "Pause once the target profit is reached (0 = no limit)"
    reset_time:
      value: "00:00"
      type: string
      title: "Risk reset time"
      description: "UTC time at which the daily risk counters reset"
    pause_duration:
      value: 0
      type: integer
      title: "Pause duration after trigger"
      minimum: 0
      description: "Seconds; 0 = pause until the next trading day"

  # Per-trade risk
  trade:
    _section:
      title: "Per-trade risk"
    sl_tp_mode:
      value: "hybrid"
      type: string
      title: "SL/TP execution mode"
      enum: ["exchange", "tick", "hybrid", "native_trailing"]
      description: |
        exchange: SL and TP both as exchange orders
        tick: SL and TP both monitored on ticks
        hybrid: SL on the exchange + TP and trailing stop on ticks (recommended)
        native_trailing: exchange-native trailing stop (TrailingStopMarketOrder)
    max_loss_pct:
      value: 0.02
      type: number
      title: "Maximum loss per trade"
      minimum: 0.005
      maximum: 0.1
      description: "Maximum loss per trade, as a percentage"
    time_limit:
      value: 604800
      type: integer
      title: "Maximum holding time"
      minimum: 3600
      description: "Seconds; 604800 = 7 days"
    atr_period:
      value: 14
      type: integer
      title: "ATR period"
      minimum: 5
      maximum: 50
      description: "ATR period used for stop-loss and take-profit calculations"

    # Take profit
    take_profit:
      _section:
        title: "Take profit"
      method:
        value: "atr"
        type: string
        title: "Take-profit method"
        enum: ["atr", "fixed", "trailing", "scaled", "none"]
        description: "How the take profit is computed (scaled: exit in tranches)"
      atr:
        multiplier:
          value: 6.0
          type: number
          title: "Take-profit ATR multiplier"
          minimum: 1.0
          maximum: 20.0
          description: "ATR multiplier for the take profit"
          optimization:
            enabled: true
            range: [3.0, 12.0]
            step: 1.0
      fixed:
        value:
          value: 0.04
          type: number
          title: "Fixed take-profit ratio"
          minimum: 0.01
          maximum: 0.2
          description: "Fixed take-profit percentage"
      trailing:
        activation_pct:
          value: 0.03
          type: number
          title: "Trailing take-profit activation"
          minimum: 0.01
          maximum: 0.1
          description: "Profit at which it activates"
        callback_pct:
          value: 0.01
          type: number
          title: "Pullback trigger ratio"
          minimum: 0.005
          maximum: 0.05
          description: "Pullback that triggers the take profit"
      scaled:
        _section:
          title: "Scaled take profit"
          description: "Used when method is scaled"
        levels:
          value: 3
          type: integer
          title: "Take-profit levels"
          minimum: 2
          maximum: 5
        level_1:
          target_pct:
            value: 0.02
            type: number
            title: "First target"
            minimum: 0.005
            maximum: 0.1
            description: "Triggers at 2% profit"
          exit_pct:
            value: 0.33
            type: number
            title: "Close ratio"
            minimum: 0.1
            maximum: 0.5
            description: "Closes 33% of the position"
        level_2:
          target_pct:
            value: 0.04
            type: number
            title: "Second target"
            minimum: 0.01
            maximum: 0.15
          exit_pct:
            value: 0.33
            type: number
            title: "Close ratio"
            minimum: 0.1
            maximum: 0.5
        level_3:
          target_pct:
            value: 0.06
            type: number
            title: "Third target"
            minimum: 0.02
            maximum: 0.2
          exit_pct:
            value: 0.34
            type: number
            title: "Close ratio"
            minimum: 0.1
            maximum: 1.0
            description: "Closes whatever remains"

    # Stop loss
    stop_loss:
      _section:
        title: "Stop loss"
      method:
        value: "atr"
        type: string
        title: "Stop-loss method"
        enum: ["atr", "fixed", "trailing", "indicator", "none"]
        description: "How the stop loss is computed"
      atr:
        multiplier:
          value: 2.0
          type: number
          title: "Stop-loss ATR multiplier"
          minimum: 0.5
          maximum: 10.0
          description: "ATR multiplier for the stop loss"
          optimization:
            enabled: true
            range: [1.0, 5.0]
            step: 0.5
      fixed:
        value:
          value: 0.02
          type: number
          title: "Fixed stop-loss ratio"
          minimum: 0.005
          maximum: 0.1
          description: "Fixed stop-loss percentage"
      trailing:
        _section:
          title: "Trailing stop"
        enabled:
          value: false
          type: boolean
          title: "Enable trailing stop"
          description: "Whether the stop trails the price"
        activation_pct:
          value: 0.02
          type: number
          title: "Activation"
          minimum: 0.01
          maximum: 0.1
          description: "Profit at which it activates"
        trailing_pct:
          value: 0.015
          type: number
          title: "Trailing distance"
          minimum: 0.005
          maximum: 0.05
          description: "Price pullback that triggers the stop"
      indicator:
        type:
          value: "supertrend"
          type: string
          title: "Indicator type"
          enum: ["supertrend", "ma", "sar"]
          description: "Indicator the stop is based on"
      break_even:
        _section:
          title: "Break-even stop"
          description: "Move the stop to the entry price once the target profit is reached"
        enabled:
          value: false
          type: boolean
          title: "Enable break-even stop"
        activation_pct:
          value: 0.015
          type: number
          title: "Activation"
          minimum: 0.005
          maximum: 0.05
          description: "Activates once profit reaches 1.5%"
        offset:
          value: 0.001
          type: number
          title: "Offset"
          minimum: 0
          maximum: 0.005
          description: "Stop placed 0.1% beyond the entry price (covers fees)"

  # Tick-level monitoring
  tick_monitoring:
    _section:
      title: "Tick-level monitoring"
      description: "Watch for stop-loss and take-profit triggers on live tick data"
    enabled:
      value: true
      type: boolean
      title: "Enable tick monitoring"
      description: "When enabled, subscribes to tick data and checks SL/TP in real time"
    tick_type:
      value: "trade"
      type: string
      title: "Tick type"
      enum: ["trade", "quote", "both"]
      description: "trade: trade ticks; quote: quote ticks; both: both"

# =============================================================================
# Signal filters
# =============================================================================
filters:
  _section:
    title: "Signal filters"

  adx_filter:
    _section:
      title: "ADX trend filter"
    enabled:
      value: false
      type: boolean
      title: "Enable ADX filter"
      description: "Use ADX to filter out signals in weak trends"
    period:
      value: 14
      type: integer
      title: "ADX period"
      minimum: 7
      maximum: 30
    threshold:
      value: 25
      type: number
      title: "ADX threshold"
      minimum: 15
      maximum: 50
      description: "Positions open only when ADX is above this value"
      optimization:
        enabled: true
        range: [20, 40]
        step: 5

  volatility_filter:
    _section:
      title: "Volatility filter"
    enabled:
      value: false
      type: boolean
      title: "Enable volatility filter"
      description: "Filter out periods of low or high volatility"
    min_atr_pct:
      value: 0.003
      type: number
      title: "Minimum ATR ratio (decimal, 0.003 = 0.3%)"
      minimum: 0.001
      maximum: 0.01
      description: "No entries while ATR/price is below this decimal ratio"
    max_atr_pct:
      value: 0.05
      type: number
      title: "Maximum ATR ratio (decimal, 0.05 = 5%)"
      minimum: 0.01
      maximum: 0.1
      description: "No entries while ATR/price is above this decimal ratio (avoids extreme volatility)"
    atr_lookback:
      value: 14
      type: integer
      title: "ATR lookback"
      minimum: 5
      maximum: 50
      description: "Volatility period (defaults to the strategy atr_period)"

  volume_filter:
    _section:
      title: "Volume filter"
    enabled:
      value: false
      type: boolean
      title: "Enable volume filter"
      description: "Filter out low-volume periods"
    ma_period:
      value: 20
      type: integer
      title: "MA period"
      minimum: 5
      maximum: 50
    threshold:
      value: 1.2
      type: number
      title: "Volume multiple"
      minimum: 1.0
      maximum: 3.0
      description: "Multiple of the moving average that current volume must exceed"

  time_filter:
    _section:
      title: "Time filter"
    enabled:
      value: false
      type: boolean
      title: "Enable time filter"
      description: "Restrict trading sessions"
    trading_hours:
      value: "00:00-23:59"
      type: string
      title: "Trading sessions"
      description: "UTC time, format HH:MM-HH:MM"
    excluded_days:
      value: []
      type: array
      title: "Excluded weekdays"
      description: "0 = Monday, 6 = Sunday"
    excluded_dates:
      value: []
      type: array
      title: "Excluded dates"
      description: "Format YYYY-MM-DD"

  cooldown:
    _section:
      title: "Cooldowns"
    min_holding_time:
      value: 0
      type: integer
      title: "Minimum holding time"
      minimum: 0
      description: "Seconds; avoids opening and closing too often"
    after_exit:
      value: 0
      type: integer
      title: "Cooldown after close"
      minimum: 0
    after_stop_loss:
      value: 300
      type: integer
      title: "Cooldown after stop loss"
      minimum: 0
      description: "Seconds; usually longer, to avoid emotional trading"
    after_take_profit:
      value: 0
      type: integer
      title: "Cooldown after take profit"
      minimum: 0

  mtf_filter:
    _section:
      title: "Multi-timeframe filter"
    enabled:
      value: false
      type: boolean
      title: "Enable MTF filter"
      description: "Confirm the trend direction on a higher timeframe"
    higher_timeframe:
      value: "4h"
      type: string
      title: "Confirmation timeframe"
      enum: ["1h", "4h", "1d"]
      description: "Higher timeframe used to confirm the trend"
    alignment_mode:
      value: "same_direction"
      type: string
      title: "Alignment mode"
      enum: ["same_direction", "not_against"]
      description: "same_direction: must agree; not_against: must not oppose"

  regime_filter:
    _section:
      title: "Market regime filter"
    enabled:
      value: false
      type: boolean
      title: "Enable market regime filter"
      description: "Distinguish trending from ranging markets"
    method:
      value: "efficiency_ratio"
      type: string
      title: "Detection method"
      enum: ["adx_slope", "atr_percentile", "efficiency_ratio"]
      description: "adx_slope: ADX slope; atr_percentile: ATR percentile; efficiency_ratio: efficiency ratio"
    lookback:
      value: 20
      type: integer
      title: "Lookback period"
      minimum: 10
      maximum: 100
    trending_threshold:
      value: 0.5
      type: number
      title: "Trend threshold (efficiency_ratio)"
      minimum: 0.3
      maximum: 0.8
      description: "efficiency_ratio only: an efficiency ratio above this value counts as trending (0..1)"
    range_pct_threshold:
      value: 0.03
      type: number
      title: "Range threshold (atr_percentile)"
      minimum: 0.005
      maximum: 0.2
      description: "atr_percentile only: a price range / mean price above this value counts as trending (decimal, 0.03 = 3%)"
    adx_period:
      value: 14
      type: integer
      title: "ADX period (adx_slope)"
      minimum: 5
      maximum: 50
      description: "adx_slope only: period used to compute ADX"

  momentum_filter:
    _section:
      title: "Momentum filter"
    enabled:
      value: false
      type: boolean
      title: "Enable momentum filter"
      description: "Use a momentum indicator to filter out weak signals"
    indicator:
      value: "rsi"
      type: string
      title: "Momentum indicator"
      enum: ["rsi", "roc", "macd"]
      description: "RSI/ROC/MACD"
    rsi:
