[project]
name = "custos-strategy-publisher"
version = "0.1.0"
description = "Build and publish signed strategy releases for the Custos signed lane"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "packaging>=24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Keyless signing runs only in the publish job; building a candidate needs none of it.
sign = [
    "sigstore==4.4.0",
]

[project.scripts]
custos-strategy-release = "custos_strategy_publisher.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/custos_strategy_publisher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

# The rule set the release producer code was written and reviewed under.
[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]
