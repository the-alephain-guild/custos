[project]
name = "custos-strategy-toolkit-nautilus"
version = "0.1.0"
description = "NautilusTrader adapter distribution for the Custos strategy toolkit"
requires-python = ">=3.12,<3.13"
dependencies = [
    "custos-strategy-toolkit==0.1.0",
    "nautilus-trader==2.0.0rc5+sodex.1",
    # The fork declares no core dependencies, so everything this package used to
    # inherit from nautilus-trader 1.230.0 has to be named here. Of the nine
    # packages the switch dropped, exactly two are used by our own code: pandas
    # (by the vendored pandas_ta) and msgspec (by the adapter config structs).
    # The pandas range matches the fork's own bound in its `visualization` extra.
    "pandas>=2.3.3,<4.0.0",
    "msgspec>=0.21",
    "pyyaml>=6",
    "packaging",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/custos_toolkit_nautilus"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "packages/custos-strategy-toolkit-nautilus/typings:packages/custos-strategy-toolkit-nautilus/src"
files = ["src/custos_toolkit_nautilus"]
exclude = ["src/custos_toolkit_nautilus/_vendor/"]
